networks:
  net-aspen:

volumes:
  solr-index-data:

services:
  backend:
    image: ${BACKEND_IMAGE_TAG:-aspendiscovery/aspen}
    env_file:
      - .env
    networks:
      - net-aspen
    tty: true
    volumes:
      - ${ASPEN_HOME:-./aspen}/conf:/usr/local/aspen-discovery/sites/${SITE_NAME}
      - ${ASPEN_HOME:-./aspen}/data:/data/aspen-discovery/${SITE_NAME}
      - ${ASPEN_HOME:-./aspen}/logs:/var/log/aspen-discovery/${SITE_NAME}
    depends_on:
      db:
        condition: service_healthy

  apache:
    image: ${BACKEND_IMAGE_TAG:-aspendiscovery/aspen}
    env_file:
      - .env
    ports:
      - "85:80"
    networks:
      - net-aspen
    volumes:
      - ${ASPEN_HOME:-./aspen}/conf:/usr/local/aspen-discovery/sites/${SITE_NAME}
      - ${ASPEN_HOME:-./aspen}/data:/data/aspen-discovery/${SITE_NAME}
      - ${ASPEN_HOME:-./aspen}/logs:/var/log/aspen-discovery/${SITE_NAME}
    command:
      - apache
    depends_on:
      - backend
    tty: true

  cron:
    image: ${BACKEND_IMAGE_TAG:-aspendiscovery/aspen}
    env_file:
      - .env
    networks:
      net-aspen:
        aliases:
          - ${SITE_NAME}
    tty: true
    volumes:
      - ${ASPEN_HOME:-./aspen}/conf:/usr/local/aspen-discovery/sites/${SITE_NAME}
      - ${ASPEN_HOME:-./aspen}/data:/data/aspen-discovery/${SITE_NAME}
      - ${ASPEN_HOME:-./aspen}/logs:/var/log/aspen-discovery/${SITE_NAME}
    command:
      - cron
    depends_on:
      - backend
      - apache


  db:
    image: ${MARIADB_IMAGE:-mariadb:10.5}
    restart: always
    env_file:
      - .env
    environment:
      - MARIADB_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD:-password}
      - MARIADB_USER=${DATABASE_USER:-user123}
      - MARIADB_PASSWORD=${DATABASE_PASSWORD:-passwd}
      - MARIADB_DATABASE=${DATABASE_NAME:-aspen}
    volumes:
      - ${ASPEN_HOME:-./aspen}/database:/var/lib/mysql
    networks:
      - net-aspen
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  solr:
    image: ${SOLR_IMAGE_TAG:-aspendiscovery/solr}
    env_file:
      - .env
    environment:
      - SOLR_PORT=${SOLR_PORT:-8983}
      - SOLR_HOST=${SOLR_HOST:-solr}
      - SOLR_DATA_HOME=/var/solr/index-data
    ports:
      - "${SOLR_PORT}:${SOLR_PORT:-8983}"
    volumes:
      - solr-index-data:/var/solr/index-data
    networks:
      - net-aspen
    entrypoint:
    - /bin/bash
    - '-c'
    - |
      init-var-solr

      # Only the index data itself is persisted, on solr-index-data (via the
      # solr.data.home mechanism, set through SOLR_DATA_HOME above). Everything
      # else under /var/solr/data (conf, core.properties, solr.xml, lib) is not
      # volume-mounted, so it always comes fresh from whatever image is running
      # instead of being frozen at whichever image first created the volume.
      for core in series genealogy grouped_works_v2 grouped_works_v3 lists course_reserves open_archives website_pages events; do
        precreate-core "$$core" "/opt/solr/server/solr/configsets/$$core"
      done

      chown -R solr:solr /var/solr
      runuser -u solr -- solr-foreground
