name: Publish Docker image to hub.docker.com
on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build, or latest to build the selected branch as latest'
        required: true
        default: 'latest'

env:
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != 'latest' && format('refs/tags/{0}', inputs.tag) || '' }}

jobs:
  build_docker_images:
    name: Push ${{ matrix.image }} image to container registries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aspen
            dockerfile: docker/Dockerfile
          - image: solr
            dockerfile: docker/files/solr/Dockerfile
          - image: tunnel
            dockerfile: docker/files/tunnel/Dockerfile
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Select image tags
        id: image_tags
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            image_tags=("$REQUESTED_TAG")
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            image_tags=(latest "${GITHUB_REF#refs/tags/}")
          else
            image_tags=(latest NOTHING)
          fi
          {
            echo "tags<<EOF"
            for image_tag in "${image_tags[@]}"; do
              for repository in aspendiscovery ghcr.io/aspen-discovery quay.io/aspen-discovery; do
                echo "$repository/$IMAGE_NAME:$image_tag"
              done
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Log in to Docker Hub
        if: github.repository == 'Aspen-Discovery/aspen-discovery'
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        if: github.repository == 'Aspen-Discovery/aspen-discovery'
        run: echo "${{ secrets.GHCR_PASSWORD }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Log in to Quay.io
        if: github.repository == 'Aspen-Discovery/aspen-discovery'
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.image_tags.outputs.tags }}
